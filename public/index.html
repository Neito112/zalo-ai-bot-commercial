<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zalo AI Bot - Control Center</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #111827;
      --border: rgba(255, 255, 255, 0.1);
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #f8fafc;
      --muted: #94a3b8;
      --success: #10b981;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

    body {
      background-color: var(--bg);
      background-image: radial-gradient(circle at 50% 10%, rgba(99, 102, 241, 0.15) 0%, transparent 60%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .panel {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    .title {
      font-size: 16px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(90deg, #fff, #a5b4fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11.5px;
      font-weight: 700;
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .badge.stopped {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      border-color: rgba(239, 68, 68, 0.3);
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
    }

    /* Server Controls Bar */
    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 12.5px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-start {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
    }
    .btn-start:hover { opacity: 0.9; transform: translateY(-1px); }

    .btn-stop {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: white;
    }
    .btn-stop:hover { opacity: 0.9; transform: translateY(-1px); }

    .btn-restart {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-restart:hover { background: rgba(255, 255, 255, 0.12); }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #4f46e5);
      color: white;
      width: 100%;
      padding: 12px;
      font-size: 13.5px;
      font-weight: 700;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.3);
    }
    .btn-primary:hover { opacity: 0.95; transform: translateY(-1px); }

    /* Form Fields */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input, select, textarea {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      color: var(--text);
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
    }

    .key-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 85px;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px;
    }

    .key-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.03);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11.5px;
      font-family: 'JetBrains Mono', monospace;
    }

    .notice {
      font-size: 11px;
      color: var(--muted);
      text-align: center;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <div class="panel">
    
    <!-- Header & Live Status -->
    <div class="header">
      <div class="title">
        <span>⚡</span> Zalo AI Bot Control
      </div>
      <div id="statusBadge" class="badge">
        <span class="badge-dot"></span>
        <span id="statusText">Đang Kết Nối...</span>
      </div>
    </div>

    <!-- Server Controls -->
    <div class="controls">
      <button class="btn btn-start" onclick="startBot()">🟢 Bật Server</button>
      <button class="btn btn-stop" onclick="stopBot()">🛑 Tắt Server</button>
      <button class="btn btn-restart" onclick="restartBot()">🔄 Khởi Động</button>
    </div>

    <!-- Zalo Bot Token -->
    <div class="form-group">
      <label>1. Zalo Bot Token</label>
      <div style="display: flex; gap: 6px;">
        <input type="password" id="zaloToken" placeholder="Nhập Token Bot Zalo..." style="flex: 1;">
        <button class="btn btn-restart" style="padding: 0 10px;" onclick="toggleToken()">👁️</button>
      </div>
    </div>

    <!-- AI Model Provider -->
    <div class="form-group">
      <label>2. Nguồn Xử Lý AI (Model Provider)</label>
      <select id="selectProvider" onchange="toggleProvider()">
        <option value="gemini">🌟 Google Gemini (Cloud API - Siêu tốc)</option>
        <option value="local">💻 Local Model Cục Bộ (Ollama / LM Studio)</option>
        <option value="hybrid">⚡ Hybrid Failover (Ưu tiên Local -> Fallback Cloud)</option>
      </select>
    </div>

    <!-- Gemini Cloud Keys Group -->
    <div id="geminiGroup" class="form-group">
      <label>3. Danh Sách Gemini API Keys Pool</label>
      <div id="keysList" class="key-list" style="margin-bottom: 6px;"></div>
      <div style="display: flex; gap: 6px;">
        <input type="text" id="newKey" placeholder="Thêm Gemini API Key mới (AIzaSy...)" style="flex: 1;">
        <button class="btn btn-restart" onclick="addKey()">+ Thêm</button>
      </div>
    </div>

    <!-- Local Model Group -->
    <div id="localGroup" style="display: none; flex-direction: column; gap: 10px; background: rgba(59, 130, 246, 0.05); border: 1px solid rgba(59, 130, 246, 0.2); border-radius: 10px; padding: 10px;">
      <div class="form-group">
        <label>Endpoint Local Model</label>
        <input type="text" id="localEndpoint" value="http://localhost:11434/v1" placeholder="http://localhost:11434/v1">
      </div>
      <div class="form-group">
        <label>Tên Model Cục Bộ</label>
        <div style="display: flex; gap: 6px;">
          <input type="text" id="localModelName" value="llama3" placeholder="llama3, qwen2.5, deepseek-r1..." style="flex: 1;">
          <button class="btn btn-restart" onclick="discoverModels()">🔍 Quét</button>
        </div>
      </div>
    </div>

    <!-- Save Button -->
    <button class="btn btn-primary" onclick="saveConfig()">
      💾 Lưu Cấu Hình & Áp Dụng
    </button>

    <div class="notice">
      💬 Mọi tính năng hỏi đáp, tạo ảnh, giọng nói, đa tác vụ đều tương tác trực tiếp 100% qua tin nhắn Zalo.
    </div>

  </div>

  <script>
    let currentConfig = {};

    function toggleProvider() {
      const p = document.getElementById('selectProvider').value;
      const localGrp = document.getElementById('localGroup');
      const geminiGrp = document.getElementById('geminiGroup');

      if (p === 'local') {
        localGrp.style.display = 'flex';
        geminiGrp.style.display = 'none';
      } else if (p === 'hybrid') {
        localGrp.style.display = 'flex';
        geminiGrp.style.display = 'flex';
      } else {
        localGrp.style.display = 'none';
        geminiGrp.style.display = 'flex';
      }
    }

    function toggleToken() {
      const el = document.getElementById('zaloToken');
      el.type = el.type === 'password' ? 'text' : 'password';
    }

    async function loadStatus() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();
        const badge = document.getElementById('statusBadge');
        const text = document.getElementById('statusText');

        if (data.isPolling) {
          badge.className = 'badge';
          text.innerHTML = `🟢 Đang Chạy • <strong>${data.botName || 'Bot Quản Đốc'}</strong> (${data.ping || 75}ms)`;
        } else {
          badge.className = 'badge stopped';
          text.innerHTML = `🔴 Đã Dừng`;
        }
      } catch (e) {
        const badge = document.getElementById('statusBadge');
        const text = document.getElementById('statusText');
        badge.className = 'badge stopped';
        text.innerHTML = `⚠️ Mất Kết Nối Server`;
      }
    }

    async function loadConfig() {
      try {
        const res = await fetch('/api/config');
        currentConfig = await res.json();

        document.getElementById('selectProvider').value = currentConfig.provider || 'gemini';
        document.getElementById('zaloToken').value = currentConfig.zaloToken || '';
        document.getElementById('localEndpoint').value = currentConfig.localEndpoint || 'http://localhost:11434/v1';
        document.getElementById('localModelName').value = currentConfig.localModelName || 'llama3';

        toggleProvider();
        renderKeys(currentConfig.apiKeys || []);
      } catch (e) {}
    }

    function renderKeys(keys) {
      const el = document.getElementById('keysList');
      el.innerHTML = '';
      if (keys.length === 0) {
        el.innerHTML = '<div style="color: var(--muted); font-size: 11px;">Chưa có API Key nào</div>';
        return;
      }
      keys.forEach((k, idx) => {
        const item = document.createElement('div');
        item.className = 'key-item';
        const masked = k.slice(0, 8) + '...' + k.slice(-6);
        item.innerHTML = `
          <span>#${idx+1} ${masked}</span>
          <button style="background:none; border:none; color:#ef4444; cursor:pointer;" onclick="deleteKey('${k}')">✕</button>
        `;
        el.appendChild(item);
      });
    }

    async function addKey() {
      const input = document.getElementById('newKey');
      const key = input.value.trim();
      if (!key) return;

      const keys = currentConfig.apiKeys || [];
      if (!keys.includes(key)) keys.push(key);

      await saveApi({ apiKeys: keys });
      input.value = '';
      await loadConfig();
    }

    async function deleteKey(key) {
      const keys = (currentConfig.apiKeys || []).filter(k => k !== key);
      await saveApi({ apiKeys: keys });
      await loadConfig();
    }

    async function saveConfig() {
      const saveBtn = event.target;
      saveBtn.innerText = '⏳ Đang lưu & nạp cấu hình...';
      saveBtn.disabled = true;

      const provider = document.getElementById('selectProvider').value;
      const zaloToken = document.getElementById('zaloToken').value.trim();
      const localEndpoint = document.getElementById('localEndpoint').value.trim();
      const localModelName = document.getElementById('localModelName').value.trim();

      await saveApi({
        provider,
        zaloToken,
        localEndpoint,
        localModelName
      });

      await loadConfig();
      await loadStatus();

      saveBtn.innerText = '💾 Lưu Cấu Hình & Áp Dụng';
      saveBtn.disabled = false;
      alert('✅ Đã lưu cấu hình API & kết nối Zalo Bot thành công!');
    }

    async function saveApi(payload) {
      await fetch('/api/config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
    }

    async function discoverModels() {
      const ep = document.getElementById('localEndpoint').value.trim();
      try {
        const res = await fetch(`/api/local-models/discover?endpoint=${encodeURIComponent(ep)}`);
        const data = await res.json();
        if (data.success && data.models && data.models.length > 0) {
          document.getElementById('localModelName').value = data.models[0];
          alert(`✅ Tìm thấy ${data.models.length} model: ${data.models.join(', ')}`);
        } else {
          alert(data.error || 'Không tìm thấy model local nào.');
        }
      } catch (e) {
        alert(`Lỗi kết nối: ${e.message}`);
      }
    }

    async function startBot() {
      document.getElementById('statusText').innerText = '⏳ Đang khởi động Bot...';
      await fetch('/api/bot/start', { method: 'POST' });
      setTimeout(loadStatus, 500);
    }

    async function stopBot() {
      document.getElementById('statusText').innerText = '⏳ Đang tắt Bot...';
      await fetch('/api/bot/stop', { method: 'POST' });
      setTimeout(loadStatus, 500);
    }

    async function restartBot() {
      document.getElementById('statusText').innerText = '⏳ Đang kết nối lại...';
      await fetch('/api/bot/restart', { method: 'POST' });
      setTimeout(loadStatus, 800);
    }

    // Init
    loadStatus();
    loadConfig();
    setInterval(loadStatus, 2000);
  </script>
</body>
</html>
